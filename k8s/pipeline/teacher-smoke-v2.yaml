apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-smoke-v2-shard-0
  namespace: pipeline
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: cloud-command-parser-worker:0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: MAX_SHARD_RECORDS
              value: "2"
            - name: TEACHER_MODEL
              value: "phi3.5"
            - name: OLLAMA_URL
              value: "http://host.k3d.internal:11434/api/generate"
            - name: S3_ENDPOINT
              value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
            - name: S3_BUCKET
              value: "datasets"
            - name: INPUT_KEY
              value: "commands_pool.jsonl"
            - name: OUTPUT_KEY
              value: "teacher/smoke-v2/shard-0.jsonl"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: worker-s3-credentials
                  key: access_key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: worker-s3-credentials
                  key: secret_key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
