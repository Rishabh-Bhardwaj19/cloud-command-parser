apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: cloud-command-parser

servers: 1
agents: 0

image: rancher/k3s:v1.35.5-k3s1

ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer

  - port: 8443:443
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: "180s"

  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
