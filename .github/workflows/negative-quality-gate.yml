name: Negative Model Quality Gate Demonstration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  untrained-model-must-fail:
    name: Untrained Pythia must fail the 95 percent JSON-validity gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.15.0+cpu
          python -m pip install transformers==5.22.2

      - name: Generate predictions with untrained Pythia-70M
        run: python tools/predict.py base

      - name: Enforce the 95 percent JSON-validity quality gate (expected to fail)
        run: |
          python tools/score.py \
            results/pythia_base_predictions.jsonl \
            data/validation.jsonl \
            --min-validity 95 \
            --out results/negative_gate_report.json

      - name: Upload negative-gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: negative-quality-gate-evidence
          path: |
            results/pythia_base_predictions.jsonl
            results/negative_gate_report.json
          if-no-files-found: warn
          retention-days: 30
