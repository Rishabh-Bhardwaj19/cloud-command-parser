name: Cloud Command Parser CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install ruff==0.11.13

      - name: Run lint checks
        run: |
          ruff check service tests \
            tools/score.py \
            tools/nacl_sim.py \
            tools/validate_subnets.py \
            tools/make_bad_predictions.py \
            tools/locustfile.py \
            tools/sample_k8s_resources.py \
            tools/run_locust_benchmark.py \
            tools/build_task7_report.py

  unit-tests:
    name: Unit tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

  model-evaluation:
    name: Model evaluation and quality gates
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.15.0+cpu
          python -m pip install transformers==5.22.2

      - name: Download v1 model from GitHub Release
        run: |
          mkdir -p .cache/ci-model models/v1 results

          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.0"

          curl -fL --retry 3 \
            "$BASE_URL/pythia-70m-v1.tar.gz" \
            -o .cache/ci-model/pythia-70m-v1.tar.gz

          curl -fL --retry 3 \
            "$BASE_URL/model.sha256" \
            -o .cache/ci-model/model.sha256

          (
            cd .cache/ci-model
            sha256sum -c model.sha256
          )

          tar -xzf .cache/ci-model/pythia-70m-v1.tar.gz \
            -C models/v1

      - name: Generate student predictions
        run: python tools/predict.py v1

      - name: Enforce 95 percent JSON validity
        run: |
          python tools/score.py \
            results/pythia_v1_predictions.jsonl \
            data/validation.jsonl \
            --min-validity 95 \
            --out results/ci_model_report.json

      - name: Verify that bad predictions fail the quality gate
        shell: bash
        run: |
          python tools/make_bad_predictions.py \
            data/validation.jsonl \
            results/intentionally_bad_predictions.jsonl

          set +e
          python tools/score.py \
            results/intentionally_bad_predictions.jsonl \
            data/validation.jsonl \
            --min-validity 95 \
            --out results/ci_bad_gate_report.json
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "ERROR: Bad predictions unexpectedly passed the gate."
            exit 1
          fi

          if [ "$STATUS" -ne 1 ]; then
            echo "ERROR: Quality gate failed for an unexpected reason."
            exit "$STATUS"
          fi

          echo "PASS: Deliberately invalid predictions were rejected."

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-quality-gate-evidence
          path: |
            results/ci_model_report.json
            results/ci_bad_gate_report.json
            results/intentionally_bad_predictions.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Add CI evidence URL to job summary
        if: always()
        run: |
          echo "## Cloud Command Parser CI evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Model asset: pythia-70m-v1.tar.gz from Release v1.0.0" >> "$GITHUB_STEP_SUMMARY"
          echo "Required JSON validity: 95%" >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
